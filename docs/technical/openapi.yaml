        - monitored_count
        - results
      properties:
        monitored_count:
          type: integer
          description: Number of jobs monitored
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobMonitorResult'
          description: Monitor results for each job

    JobDedupCheckResponse:
      type: object
      required:
        - job_id
        - has_artifact
      properties:
        job_id:
          type: string
          description: Job identifier
        has_artifact:
          type: boolean
          default: false
          description: Whether job produced an artifact
        artifact_path:
          type: string
          nullable: true
          description: Path to artifact
        signal:
          type: string
          nullable: true
          description: Dedup signal (LOW/MEDIUM/HIGH)
          enum:
            - LOW
            - MEDIUM
            - HIGH
        similarity_score:
          type: number
          format: float
          nullable: true
          description: Similarity score
        message:
          type: string
          nullable: true
          description: Status message

    BatchJobSpec:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - research
            - story
          description: Job type
        topic:
          type: string
          nullable: true
          description: Research topic (required for research jobs)
        tags:
          type: array
          items:
            type: string
          default: []
          description: Tags for research job
        max_stories:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Max stories for story job
        enable_dedup:
          type: boolean
          default: false
          description: Enable dedup for story job
        target_length:
          type: integer
          nullable: true
          minimum: 300
          maximum: 10000
          description: Target story length
        model:
          type: string
          nullable: true
          description: Model override
        timeout:
          type: integer
          nullable: true
          description: Timeout in seconds

    BatchTriggerRequest:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/BatchJobSpec'
          minItems: 1
          maxItems: 50
          description: List of job specifications
        webhook_url:
          type: string
          nullable: true
          description: Webhook URL when all batch jobs complete
        webhook_events:
          type: array
          items:
            type: string
          default: ["succeeded", "failed", "skipped"]
          description: Events that trigger webhook

    BatchTriggerResponse:
      type: object
      required:
        - batch_id
        - job_ids
        - job_count
      properties:
        batch_id:
          type: string
          description: Created batch ID
        job_ids:
          type: array
          items:
            type: string
          description: List of created job IDs
        job_count:
          type: integer
          description: Number of jobs in batch
        status:
          type: string
          default: "queued"
          description: Initial batch status
        message:
          type: string
          default: "Batch triggered successfully"

    BatchJobStatus:
      type: object
      required:
        - job_id
        - type
        - status
      properties:
        job_id:
          type: string
          description: Job identifier
        type:
          type: string
          description: Job type
        status:
          type: string
          description: Job status
        error:
          type: string
          nullable: true
          description: Error message if failed

    BatchStatusResponse:
      type: object
      required:
        - batch_id
        - status
        - total_jobs
        - completed_jobs
        - succeeded_jobs
        - failed_jobs
        - running_jobs
        - queued_jobs
        - created_at
      properties:
        batch_id:
          type: string
          description: Batch identifier
        status:
          type: string
          description: Aggregate batch status
        total_jobs:
          type: integer
          description: Total number of jobs
        completed_jobs:
          type: integer
          description: Number of completed jobs
        succeeded_jobs:
          type: integer
          description: Number of succeeded jobs
        failed_jobs:
          type: integer
          description: Number of failed jobs
        running_jobs:
          type: integer
          description: Number of running jobs
        queued_jobs:
          type: integer
          description: Number of queued jobs
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/BatchJobStatus'
          default: []
          description: Individual job statuses
        created_at:
          type: string
          format: date-time
          description: Batch creation timestamp
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Batch completion timestamp
        webhook_url:
          type: string
          nullable: true
          description: Webhook URL
        webhook_sent:
          type: boolean
          default: false
          description: Whether webhook was sent
        message:
          type: string
          nullable: true
          description: Status message

    # Research Additional Schemas
    ResearchDedupCheckRequest:
      type: object
      required:
        - card_id
      properties:
        card_id:
          type: string
          description: Card ID to check for duplicates
          pattern: "^RC-\\d{8}-\\d{6}$"

    SimilarCard:
      type: object
      required:
        - card_id
        - similarity_score
      properties:
        card_id:
          type: string
          description: Similar card identifier
        similarity_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Similarity score (0.0-1.0)
        title:
          type: string
          nullable: true
          description: Card title

    ResearchDedupCheckResponse:
      type: object
      required:
        - card_id
        - signal
        - similarity_score
        - index_size
      properties:
        card_id:
          type: string
          description: Checked card ID
        signal:
          type: string
          description: Dedup signal level
          enum:
            - LOW
            - MEDIUM
            - HIGH
        similarity_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Highest similarity score (0.0-1.0)
        nearest_card_id:
          type: string
          nullable: true
          description: Most similar card ID
        similar_cards:
          type: array
          items:
            $ref: '#/components/schemas/SimilarCard'
          default: []
          description: List of similar cards
        index_size:
          type: integer
          default: 0
          description: Number of cards in FAISS index
        message:
          type: string
          nullable: true
          description: Status message

    MatchingTemplateItem:
      type: object
      required:
        - template_id
        - template_name
        - match_score
      properties:
        template_id:
          type: string
          description: Template ID (e.g., T-SYS-001)
        template_name:
          type: string
          description: Human-readable template name
        match_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Match score (0.0-1.0)
        canonical_core:
          type: object
          additionalProperties: true
          default: {}
          description: Template's canonical core values
        match_details:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-dimension match breakdown

    ResearchMatchingTemplatesRequest:
      type: object
      required:
        - card_id
      properties:
        card_id:
          type: string
          description: Research card ID to match against templates
          pattern: "^RC-\\d{8}-\\d{6}$"
        max_templates:
          type: integer
          minimum: 1
          maximum: 15
          default: 5
          description: Maximum number of templates to return
        min_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          default: 0.5
          description: Minimum match score threshold (0.0-1.0)

    ResearchMatchingTemplatesResponse:
      type: object
      required:
        - card_id
        - matching_templates
        - total_templates
      properties:
        card_id:
          type: string
          description: Research card ID that was matched
        matching_templates:
          type: array
          items:
            $ref: '#/components/schemas/MatchingTemplateItem'
          default: []
          description: List of matching templates sorted by score (highest first)
        total_templates:
          type: integer
          description: Total number of templates evaluated
        card_affinity:
          type: object
          nullable: true
          additionalProperties: true
          description: The research card's canonical affinity used for matching
        message:
          type: string
          nullable: true
          description: Status message

    # FastAPI standard validation error schemas
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: List of validation errors

    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          description: Location of the error
        msg:
          type: string
          description: Error message
        type:
          type: string
          description: Error type

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key authentication (optional).
        Required when API_AUTH_ENABLED=true.
        Excluded endpoints: /health, /resource/status

security:
  - ApiKeyAuth: []
  - {}  # Also allow unauthenticated access (when API_AUTH_ENABLED=false)
