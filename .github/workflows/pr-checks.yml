name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # PR 제목이 Conventional Commits 형식인지 검증
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            tech
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR 제목은 소문자로 시작해야 합니다.

            예시:
            ✅ feat: 새로운 스토리 템플릿 추가
            ✅ fix: 리서치 API 오류 수정
            ❌ feat: Add new template (대문자 시작)

      - name: Additional validation for develop → main PRs
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;

            // Conventional Commits 형식 검증
            const conventionalCommitPattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|tech)(\(.+\))?:\s.+/;

            if (!conventionalCommitPattern.test(prTitle)) {
              core.setFailed(
                '❌ develop → main PR 제목이 Conventional Commits 형식을 따르지 않습니다.\n\n' +
                '⚠️  CRITICAL: release-please는 이 형식에 의존하여 자동 릴리즈를 생성합니다.\n' +
                '형식을 따르지 않으면 릴리즈가 생성되지 않습니다!\n\n' +
                '현재 제목: ' + prTitle + '\n\n' +
                '올바른 형식:\n' +
                '  <type>: <description> (#<pr-number>)\n\n' +
                '예시:\n' +
                '  ✅ feat: implement scheduler API integration (#98)\n' +
                '  ✅ fix: resolve authentication timeout issue (#102)\n' +
                '  ✅ docs: update API documentation for v1.6.0 (#105)\n\n' +
                '잘못된 예시:\n' +
                '  ❌ Develop (#98)\n' +
                '  ❌ Merge develop into main\n' +
                '  ❌ Release v1.6.0\n\n' +
                '자세한 내용은 CLAUDE.md Section 4.4를 참고하세요.'
              );
            } else {
              console.log('✅ develop → main PR 제목이 올바른 형식입니다: ' + prTitle);
            }

  # PR 본문에 Issue 번호가 포함되어 있는지 검증
  validate-issue-link:
    name: Validate Issue Link
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR links to an issue
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;

            // develop → main PR은 릴리즈/동기화 목적이므로 Issue 연결 검증 건너뛰기
            if (baseBranch === 'main' && headBranch === 'develop') {
              console.log('✅ develop → main PR은 Issue 연결 검증을 건너뜁니다.');
              return;
            }

            const prBody = context.payload.pull_request.body || '';

            // Issue 연결 패턴: Fixes #123, Closes #123, Resolves #123, Refs #123 등
            const issuePattern = /(fix(es|ed)?|close(s|d)?|resolve(s|d)?|refs?)\s+#\d+/i;

            if (!issuePattern.test(prBody)) {
              core.setFailed(
                '❌ PR 본문에 연결된 Issue가 없습니다.\n\n' +
                'PR 본문에 Issue 번호를 포함해주세요.\n' +
                '예시: Fixes #123, Closes #456, Refs #789\n\n' +
                '모든 PR은 반드시 Issue와 연결되어야 합니다.'
              );
            } else {
              console.log('✅ Issue 연결이 확인되었습니다.');
            }
